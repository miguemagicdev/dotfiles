# =============================================
# MY TMUX SETTINGS
# =============================================

# Enable mouse mode (scrolling, resizing panes)
set -g mouse on

# Enable vi keys in copy mode
set-window-option -g mode-keys vi

# Show visual selection in copy mode
set -g visual-activity on
set -g visual-bell on
set -g visual-silence on
set -g repeat-time 1000

# CRITICAL: This makes selection highlight visible
set -g mode-style "fg=black,bg=yellow"   # or "fg=white,bg=blue"

# Increase scrollback buffer (default is 2000)
set -g history-limit 50000

# Start window and pane numbering at 1 (instead of 0)
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows automatically when one is closed
set -g renumber-windows on

# Reduce escape time for faster Vim responsiveness
set -s escape-time 0

# =============================================
# VISUALS & STATUS BAR
# =============================================

# True color support
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Use tmux-powerline for the status bar
set -g status-left "#(sh ~/.tmux/plugins/tmux-powerline/powerline.sh left)"
set -g status-right "#(sh ~/.tmux/plugins/tmux-powerline/powerline.sh right)"

# =============================================
# KEYBINDS
# =============================================

# Vi Keybindings for copy mode

# Selection
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi C-v send -X select-block
bind -T copy-mode-vi i send -X cancel

# Copy
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# =============================================
# PLUGINS (via TPM)
# =============================================

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'    # Persist sessions after restart
set -g @plugin 'tmux-plugins/tmux-continuum'    # Auto-save sessions
set -g @plugin 'tmux-plugins/tmux-yank'         # Better system clipboard integration
set -g @plugin 'christoomey/vim-tmux-navigator' # Vim Integration
set -g @plugin 'erikw/tmux-powerline'           # Theme with widgets

# Automatic restore on tmux start
set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'

# Initialize TPM
run '~/.tmux/plugins/tpm/tpm'
