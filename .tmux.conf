# =============================================
# GLOBAL SETTINGS
# =============================================

# Change prefix from Ctrl+b to Ctrl+a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Enable mouse mode (scrolling, resizing panes)
set -g mouse on

# Increase scrollback buffer (default is 2000)
set -g history-limit 50000

# Start window and pane numbering at 1 (instead of 0)
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows automatically when one is closed
set -g renumber-windows on

# Reduce escape time for faster Vim responsiveness
set -s escape-time 0

# =============================================
# KEY BINDINGS
# =============================================

# Easy config reload
bind r source-file ~/.tmux.conf \; display "Config Reloaded!"

# Split panes using | and - (more intuitive)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Smart pane switching with awareness of Vim splits
# Requires 'christoomey/vim-tmux-navigator' plugin in Vim
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# =============================================
# VISUALS & STATUS BAR
# =============================================

# True color support
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Status bar styling
set -g status-position bottom
set -g status-left " #S "
set -g status-right "%Y-%m-%d %H:%M "

# Highlight active window
setw -g window-status-current-format ' #I:#W '

# =============================================
# PLUGINS (via TPM)
# =============================================

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect' # Persist sessions after restart
set -g @plugin 'tmux-plugins/tmux-continuum' # Auto-save sessions
set -g @plugin 'tmux-plugins/tmux-yank'      # Better system clipboard integration

# Automatic restore on tmux start
set -g @continuum-restore 'on'

# Initialize TMUX plugin manager (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
